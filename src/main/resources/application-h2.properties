# Profile "h2": in-memory database for local development and tests. Data disappears on shutdown.
spring.datasource.url=jdbc:h2:mem:frauddb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Migration scripts for H2 plus demo data (db/seed). The seed is NEVER loaded by other profiles.
spring.flyway.locations=classpath:db/migration/h2,classpath:db/seed

# DEV-ONLY passwords so the app starts with no setup. Other profiles require real environment variables.
fraud.security.admin-password=${FRAUD_ADMIN_PASSWORD:admin-dev-password}
fraud.security.analyst-password=${FRAUD_ANALYST_PASSWORD:analyst-dev-password}
fraud.security.ingestion-password=${FRAUD_INGESTION_PASSWORD:ingestion-dev-password}
