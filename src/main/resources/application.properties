# =====================================================================
# Settings shared by every environment. Database-specific settings are in
# application-h2 / application-postgres / application-mysql.properties.
# =====================================================================
spring.application.name=fraud-rule-engine
server.port=8080

# Default = in-memory H2 (zero setup). Override WITHOUT editing this file:
#   SPRING_PROFILES_ACTIVE=postgres   |   -Dspring.profiles.active=mysql
spring.profiles.active=h2

# --- JPA / Hibernate: Flyway owns the schema, Hibernate only CHECKS it ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Web ---
spring.data.web.pageable.max-page-size=100
server.error.include-stacktrace=never
server.error.include-message=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# --- Swagger UI at /swagger-ui.html, OpenAPI JSON at /v3/api-docs ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# --- Observability ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
logging.level.root=INFO
logging.level.com.example.fraud=INFO
# The request id (see RequestIdFilter) is added to every log line
logging.pattern.level=%5p [%X{requestId:-}]

# =====================================================================
# FRAUD RULE THRESHOLDS - change behaviour here (or with environment variables such as
# FRAUD_RULES_HIGH_AMOUNT_THRESHOLD=30000) without touching Java code. All amounts are ZAR.
# Durations: 10m = 10 minutes, 24h = 24 hours.
# =====================================================================
fraud.rules.high-amount.enabled=true
fraud.rules.high-amount.threshold=20000
fraud.rules.high-amount.critical-threshold=50000

fraud.rules.velocity.enabled=true
fraud.rules.velocity.window=10m
fraud.rules.velocity.max-transactions=5

fraud.rules.geography.enabled=true
fraud.rules.geography.window=60m

fraud.rules.night.enabled=true
fraud.rules.night.start-hour=1
fraud.rules.night.end-hour=5
fraud.rules.night.min-amount=500
fraud.rules.night.zone=Africa/Johannesburg

fraud.rules.gambling.enabled=true
fraud.rules.gambling.large-amount=5000
fraud.rules.gambling.repeat-window=24h
fraud.rules.gambling.repeat-count=3

fraud.rules.card-testing.enabled=true
fraud.rules.card-testing.small-amount=20
fraud.rules.card-testing.window=10m
fraud.rules.card-testing.min-attempts=3

fraud.rules.blacklist.enabled=true
