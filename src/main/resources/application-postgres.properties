# Profile "postgres": PostgreSQL (the target production database).
# Everything sensitive comes from environment variables - nothing is committed to source control.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:frauddb}
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10

spring.flyway.locations=classpath:db/migration/postgresql

# No defaults on purpose: if a password variable is missing the application refuses to start (fail fast).
fraud.security.admin-password=${FRAUD_ADMIN_PASSWORD}
fraud.security.analyst-password=${FRAUD_ANALYST_PASSWORD}
fraud.security.ingestion-password=${FRAUD_INGESTION_PASSWORD}

# Structured (JSON, Elastic Common Schema) logs for log-aggregation tools
logging.structured.format.console=ecs
