# Profile "mysql": MySQL 8+. Use when PostgreSQL is not available.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:frauddb}?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
# allowPublicKeyRetrieval / useSSL=false are for local Docker only. Use TLS in production.

spring.flyway.locations=classpath:db/migration/mysql

fraud.security.admin-password=${FRAUD_ADMIN_PASSWORD}
fraud.security.analyst-password=${FRAUD_ANALYST_PASSWORD}
fraud.security.ingestion-password=${FRAUD_INGESTION_PASSWORD}

logging.structured.format.console=ecs
